name: Release PDFCraft API Edition
on:
  push:
    tags: ['v*-api.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v*-api.* tag to build and publish; blank only builds'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable: pdfcraft
            rustflags: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win64
            executable: pdfcraft.exe
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      PDFCRAFT_BUILD_LABEL: API20261029.3
      CARGO_PROFILE_RELEASE_LTO: 'false'
      PDFCRAFT_REQUIRE_WINRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: pdfcraft-api-${{ matrix.target }}
          save-if: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare hash-verified offline OCR resources
        env:
          PDFCRAFT_MODELS_DIR: ${{ runner.temp }}/pdfcraft-pinned-ocr
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, os, pathlib, tomllib, urllib.request, zipfile
          # Reuse only the already-public, licensed OCR resources. Never run the
          # old application. The archive AND each model/license are hash pinned.
          url = 'https://github.com/lain-creator/PdfCraft-API-Edition/releases/download/v0.14.0-api.20261029.1/PdfCraft-0.14.0-api.20261029.1-macos-arm64.zip'
          with urllib.request.urlopen(url, timeout=120) as response:
              payload = response.read((100 << 20) + 1)
          assert len(payload) <= 100 << 20, 'OCR resource archive exceeds limit'
          assert hashlib.sha256(payload).hexdigest() == 'a3188025fddcbf7c0574a45a0cc2f59479363e7b2f5bdf2c5b1bae30a6bb3e68', 'OCR resource archive hash mismatch'
          manifest = tomllib.loads(pathlib.Path('ATTRIBUTION.toml').read_text(encoding='utf-8'))
          output = pathlib.Path(os.environ['PDFCRAFT_MODELS_DIR'])
          output.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for model in manifest['fetched']:
                  if model['kind'] != 'model':
                      continue
                  for name, digest in ((model['file'], model['sha256']), (model['file'] + '.LICENCE.txt', model['licence_sha256'])):
                      assert pathlib.PurePosixPath(name).name == name, 'Invalid model filename'
                      entry = archive.getinfo('PdfCraft.app/Contents/Resources/models/' + name)
                      assert entry.file_size <= 64 << 20, 'OCR resource exceeds limit'
                      data = archive.read(entry)
                      assert hashlib.sha256(data).hexdigest() == digest, 'OCR model/license hash mismatch: ' + name
                      (output / name).write_bytes(data)
          print('Verified pinned OCR models and licenses; no previous application is used.')
          PY
      - name: Check built-in terminology and packaging
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked -p pdfcraft-ai -p xtask
          cargo xtask assets
          cargo xtask layers
      - name: Build
        env:
          # Static CRT applies only to the target app, not host proc-macros/xtask tests.
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked --release -p pdfcraft --target ${{ matrix.target }}
      - name: Package and checksum
        env:
          PDFCRAFT_PACKAGE_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
          PDFCRAFT_MODELS_DIR: ${{ runner.temp }}/pdfcraft-pinned-ocr
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=0.14.0-api.20261029.3
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-api\.[0-9.]+$ ]] || exit 1
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$REQUESTED_TAG^{commit}")" ]]
            version="${REQUESTED_TAG#v}"
          fi
          cargo xtask local-api-package "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-API-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Source and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=PdfCraft-API-source/ HEAD --output "dist/PdfCraft-${RELEASE_TAG#v}-source.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish independent API Edition
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --latest --title "PDFCraft API Edition · ${RELEASE_TAG#v}" --notes-file RELEASE-NOTES.md dist/*.zip dist/SHA256SUMS.txt
