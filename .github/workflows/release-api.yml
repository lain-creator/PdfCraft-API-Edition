name: Release PDFCraft API Edition
on:
  push:
    tags: ['v*-api.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      PDFCRAFT_BUILD_LABEL: API20261029.1
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: pdfcraft-api-aarch64
      - name: Check built-in terminology and packaging
        run: |
          cargo fmt --check
          cargo test --locked -p pdfcraft-ai -p xtask
          cargo xtask assets
          cargo xtask layers
      - name: Build
        run: cargo build --locked --release -p pdfcraft --target aarch64-apple-darwin
      - name: Package and checksum
        env:
          PDFCRAFT_PACKAGE_BINARY: ${{ github.workspace }}/target/aarch64-apple-darwin/release/pdfcraft
        run: |
          set -euo pipefail
          version=0.14.0-api.20261029.1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          cargo xtask local-api-package "$version"
          git archive --format=zip --prefix=PdfCraft-API-source/ HEAD --output "dist/PdfCraft-${version}-source.zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && shasum -a 256 -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-API-macos-arm64
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PdfCraft-API-macos-arm64
          path: dist
      - name: Publish independent API Edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "PDFCraft API Edition · ${GITHUB_REF_NAME#v}" --notes-file RELEASE-NOTES.md dist/*.zip dist/SHA256SUMS.txt
