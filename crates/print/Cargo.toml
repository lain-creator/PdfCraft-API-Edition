[package]
name = "pdfcraft-print"
description = "Printing: page selection, sizing (fit, actual, shrink, custom), multiple pages per sheet, booklets, posters, comments & forms; print-ready PDF and the system spooler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-print = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-model = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Safe loading and export checks for the optional system PDF print component.
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
pdfcraft-render = { workspace = true }
